name: Grails 8 CI

on:
  push:
    branches:
      - grails8
  pull_request:
    branches:
      - grails8

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample: [initial, complete]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test integrationTest --console=plain --stacktrace
        working-directory: ${{ matrix.sample }}
